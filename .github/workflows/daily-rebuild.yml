name: Daily rebuild

on:
  schedule:
    # 09:00 เวลาไทย (Asia/Bangkok, UTC+7)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Try a free price refresh (never invent prices)
        run: python3 refresh.py

      - name: Rebuild static page
        run: python3 build.py

      - name: Commit and push if files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html refresh-status.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
